services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
      POSTGRES_DB: catalog
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog"]
      interval: 2s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgres://catalog:catalog@db:5432/catalog
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }
